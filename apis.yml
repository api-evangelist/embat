aid: embat
name: Embat
description: >-
  Embat is a real-time treasury management platform for finance teams, founded in Madrid and
  backed by Creandum. Its REST/JSON API (OpenAPI 3.1, 103 operations across 21 resource areas)
  connects third-party applications and ERPs to Embat to manage bank connections, balances,
  transactions, payments and payment orders, cash-flow forecasting, scenarios, accounting
  entries and accounts, contacts, and bank reconciliation across multiple companies.
  Authentication is HTTP Bearer using a JWT idToken obtained from an email/password token
  endpoint (60-minute expiry, no refresh); every resource is scoped by a companyId path
  parameter and list endpoints paginate with limit + nextPageToken.
