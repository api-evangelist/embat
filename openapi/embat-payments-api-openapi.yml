    ContactNewAccountDetails:
      properties:
        iban:
          anyOf:
          - type: string
          - type: 'null'
          title: Iban
          description: International Bank Account Number. Used to identify accounts in IBAN-based rails (e.g. SEPA). Spaces are removed and the value is upper-cased before storage.
          examples:
          - ES9121000418450200051332
        bic:
          anyOf:
          - type: string
          - type: 'null'
          title: Bic
          description: Bank Identifier Code (BIC/SWIFT) of the account. Spaces are removed and the value is upper-cased before storage.
          examples:
          - BBVAESMMXXX
        swift:
          anyOf:
          - type: string
          - type: 'null'
          title: Swift
          description: 'Deprecated alias of `bic` kept for backward compatibility: when sent, its value overrides `bic`. Spaces are removed and the value is upper-cased before storage.'
          examples:
          - BBVAESMMXXX
        accountNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountnumber
          description: Local account number, used by non-IBAN rails (e.g. accounts in ARS, AUD, BRL, CAD, JPY...). Spaces are removed and the value is upper-cased before storage.
          examples:
          - '123456789'
        accountType:
          anyOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          - type: 'null'
          description: Type of the local account (`CHECKING` or `SAVINGS`). An empty string is treated the same as omitting this field.
        routingNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Routingnumber
          description: 9-digit ABA routing number identifying the bank, used by US ACH/Fedwire transfers. Spaces are removed and the value is upper-cased before storage.
          examples:
          - '021000021'
        sortCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Sortcode
          description: 6-digit sort code identifying the bank branch, used by UK BACS/CHAPS/Faster Payments transfers. Spaces are removed and the value is upper-cased before storage.
          examples:
          - '040004'
        institutionNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Institutionnumber
          description: 3-digit institution number identifying the bank, used together with `transitNumber` by Canadian EFT transfers. Spaces are removed and the value is upper-cased before storage.
          examples:
          - '001'
        transitNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Transitnumber
          description: 5-digit transit number identifying the bank branch, used together with `institutionNumber` by Canadian EFT transfers. Spaces are removed and the value is upper-cased before storage.
          examples:
          - '12345'
        bankCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankcode
          description: Local bank identifier code, used by rails not covered by the other fields.
        branchCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Branchcode
          description: Local bank branch code, used by rails not covered by the other fields.
        bsb:
          anyOf:
          - type: string
          - type: 'null'
          title: Bsb
          description: 6-digit BSB code identifying the bank and branch, used by Australian bank transfers.
          examples:
          - 062-000
        bankCountryCode:
          anyOf:
          - $ref: '#/components/schemas/ISOCountryCodes'
          - type: 'null'
          description: ISO 3166-1 alpha-2 country code of the bank holding this account. An empty string is treated the same as omitting this field.
          examples:
          - ES
      type: object
      title: ContactNewAccountDetails
    BulkPatchPaymentsRequestSchema:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AuxBulkPatchPaymentsRequestSchema'
          type: array
          title: Data
          description: Payments to update, identified by `customId`.
      type: object
      required:
      - data
      title: BulkPatchPaymentsRequestSchema
    AttributeValueRequestSchema:
      properties:
        customId:
          type: string
          title: Customid
          description: Custom ID of the attribute (see the Attributes endpoints) being set.
          examples:
          - cost-center
        value:
          type: string
          title: Value
          description: Display text of the value being set on this entity.
          examples:
          - Marketing
        valueCustomId:
          anyOf:
          - type: string
          - type: 'null'
          title: Valuecustomid
          description: Custom ID of one of the attribute's predefined `values`, when the attribute is of type `list`. Leave unset for free-form `string`/`number` attributes.
          examples:
          - marketing
        parentCustomId:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentcustomid
          description: Not used when attaching an attribute value to an entity.
      type: object
      required:
      - customId
      - value
      title: AttributeValueRequestSchema
      description: 'Attaches an attribute value to another entity (payment, contact, operation,

        transaction, accounting entry...).'
    PatchPaymentsRequestSchema:
      properties:
        sync:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sync
          description: Marks the payment as synchronized with the accounting system.
        additionalInfo:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Additionalinfo
