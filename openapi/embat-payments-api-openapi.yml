      title: SourceEnum
    GetPaymentsResponseSchema:
      properties:
        method:
          type: string
          title: Method
          description: Payment method. Defaults to `bank-transaction` when not sent.
          default: bank-transaction
          examples:
          - bank-transaction
        transactionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Transactionid
          description: Embat ID of the bank transaction linked to this payment.
        operations:
          anyOf:
          - items:
              $ref: '#/components/schemas/OperationPaymentResponseSchema'
            type: array
          - type: 'null'
          title: Operations
          description: Operations this payment is applied to.
        productId:
          anyOf:
          - type: string
          - type: 'null'
          title: Productid
          description: Embat product ID. You can get them from "Products" endpoints.
        contactCustomId:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactcustomid
          description: Custom ID of the contact (client/supplier) involved in the payment.
        date:
          type: string
          format: date-time
          title: Date
          description: Date the payment was made or received.
        concept:
          anyOf:
          - type: string
          - type: 'null'
          title: Concept
          description: Free-text description of the payment.
          examples:
          - 'Invoice #2024-001 payment'
        amount:
          type: number
          title: Amount
          description: Payment amount in the payment `currency`. Positive for collections, negative for outgoing payments.
          examples:
          - 1250.5
        accountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Accountingamount
          description: Payment amount expressed in the company accounting currency. If omitted, it defaults to `amount`, `accountingCurrency` defaults to `currency` and `exchangeRate` is set to 1.0.
          examples:
          - 1250.5
        currency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: ISO currency code of `amount`. Defaults to `EUR` when omitted.
          examples:
          - EUR
        accountingCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: ISO currency code of `accountingAmount`. Defaults to `currency` when omitted.
          examples:
          - EUR
        exchangeRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Exchangerate
          description: Exchange rate applied between `currency` and `accountingCurrency`. Defaults to 1.0 when omitted.
          examples:
          - 1.0
        additionalInfo:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Additionalinfo
          description: Free-form key/value metadata to attach to the payment.
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values to attach to the payment.
        id:
          type: string
          title: Id
          description: Embat payment ID
        customId:
          anyOf:
          - type: string
          - type: 'null'
          title: Customid
          description: Your own unique ID for the payment. If the payment has none, it is auto-generated as `id` concatenated with `companyId`.
        type:
          anyOf:
          - $ref: '#/components/schemas/PaymentShortTypeEnum'
          - type: 'null'
          description: 'Payment classification: `contacts`, `accountings`, `operations`, `banks` or `salesOrder`. Payments created through this API are always classified as `operations`.'
        productAccountingCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Productaccountingcode
          description: Product accounting code
        accountingCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountingcode
          description: Accounting account code the payment is posted to.
        paymentSource:
          $ref: '#/components/schemas/SourceEnum'
          description: Origin of the payment record.
          default: embat
        companyId:
          type: string
          title: Companyid
          description: Embat company ID. You can get them from "companies" endpoints
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: Last updated date of the entity in the database
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: Created date of the entity in the database
        sync:
          type: boolean
          title: Sync
          description: Whether the payment is synchronized with the accounting system.
          default: false
        registered:
          type: boolean
          title: Registered
          description: Whether the payment is registered in the accounting system.
          default: false
        userId:
          anyOf:
          - type: string
          - type: 'null'
          title: Userid
          description: Embat ID of the user who created the payment, if created manually.
        transactionAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Transactionamount
          description: Total amount of the bank transaction linked to this payment.
        transactionAccountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Transactionaccountingamount
          description: Accounting amount of the bank transaction linked to this payment.
        multicurrency:
          type: boolean
          title: Multicurrency
          description: True when the payment's operations use a currency different from the payment currency, indicating a currency exchange took place.
          default: false
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Error message recorded against the payment, if any.
          examples:
          - Missing account
        contact:
          anyOf:
          - $ref: '#/components/schemas/BaseContactSchema-Output'
          - type: 'null'
          description: Contact (client/supplier) involved in the payment.
        intercompany:
          anyOf:
          - $ref: '#/components/schemas/IntercompanyPaymentSchema'
          - type: 'null'
          description: Intercompany settlement details, when the payment is part of one.
        transactionAttributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Transactionattributes
          description: Custom attribute values of the bank transaction linked to this payment.
      type: object
      required:
      - date
      - amount
      - id
      - companyId
      - updatedAt
      - createdAt
      title: GetPaymentsResponseSchema
    ContactAddressSchema:
