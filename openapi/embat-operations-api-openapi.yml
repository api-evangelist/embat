    PostOperationsRequestSchema:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/OperationStatusEnum'
          - type: 'null'
          description: 'Status of the operation. On creation, only `paid`, `cancel` and `payment_in_progress` are respected as sent (`paid`/`cancel` also reset `pendingAmount` and `pendingAccountingAmount` to 0). Any other value — including `paymentOrder` and `shipped` (legacy values, avoid using them in new integrations) — is **silently discarded** and recomputed from `dueDate`: `pending` if `dueDate` is today or later, `overdue` otherwise. The same recomputation applies when this field is omitted.'
          examples:
          - pending
        paymentDate:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Paymentdate
          description: Date the operation is expected to be (or was) paid. Only the calendar date is meaningful; the time component is not preserved as sent.
        chargeAccount:
          anyOf:
          - type: string
          - type: 'null'
          title: Chargeaccount
          description: IBAN of your own bank account the operation is charged to.
        contactAccount:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactaccount
          description: IBAN of the counterparty's (contact's) bank account.
        issuanceDate:
          type: string
          format: date-time
          title: Issuancedate
          description: Issuance date of the operation's source document. Only the calendar date is meaningful; the time component is not preserved as sent. If `dueDate` is omitted, it defaults to this date, and `paymentDate` in turn defaults to `dueDate`.
        dueDate:
          type: string
          format: date-time
          title: Duedate
          description: 'Due date of the operation. Only the calendar date is meaningful; the time component is not preserved as sent. On creation, unless `status` is explicitly set to `paid`, `cancel` or `payment_in_progress`, the operation''s status is computed from this date: `pending` if it is today or later, `overdue` otherwise.'
        accountingCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountingcode
          description: Accounting account code the operation is posted to.
        accountingName:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountingname
          description: Accounting account name the operation is posted to.
        operationsCustomIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Operationscustomids
          description: 'Custom IDs of other operations grouped under this one, to represent an invoice group or remittance (typically combined with `documentType` set to `invoiceGroup`). Takes effect on `POST` (create or upsert): each referenced operation is marked `paid`, its `pendingAmount`/`pendingAccountingAmount` set to 0 and its payment date set to this operation''s `paymentDate`. Resending the remittance without some previously grouped operations releases them: they return to `pending` with their full pending amount. Sending this field on a `PATCH` update has no effect.'
        concept:
          type: string
          title: Concept
          description: Free-text description of the operation.
          examples:
          - 'Invoice #2024-001'
        amount:
          type: number
          title: Amount
          description: Total amount of the operation, in `currency`.
          examples:
          - 1250.5
        accountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Accountingamount
          description: 'Amount of the operation expressed in the company accounting currency. If omitted, it defaults to `amount` (and `accountingCurrency` is reset to `currency`). Note: whenever the resulting `accountingCurrency` equals `currency`, this value is **forced to `amount`**, even if you explicitly sent a different value.'
          examples:
          - 1250.5
        pendingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Pendingamount
          description: Amount still pending settlement, in `currency`. Defaults to `amount` when omitted.
          examples:
          - 1250.5
        pendingAccountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Pendingaccountingamount
          description: Amount still pending settlement, expressed in the accounting currency. If omitted, it is derived proportionally from `pendingAmount` and `accountingAmount`; it is 0 when `amount` or `accountingAmount` is 0.
          examples:
          - 1250.5
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code of `amount`.
          examples:
          - EUR
        accountingCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: 'ISO currency code of `accountingAmount`. Defaults to `currency` when omitted. Note: when `accountingAmount` is omitted, this field is also **reset to `currency`**, even if you explicitly sent a different value.'
          examples:
          - EUR
        exchangeRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Exchangerate
          description: 'Exchange rate applied between `currency` and `accountingCurrency`. If omitted, it is derived from `amount`/`accountingAmount` (1.0 when `accountingAmount` is 0). Note: whenever `amount` equals `accountingAmount`, the value is **forced to 1.0**, even if you explicitly sent a different one; out-of-range or non-finite values are also silently reset to 1.0.'
          examples:
          - 1.0
        paymentMethod:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentmethod
          description: Payment method associated with the operation (e.g. `bank-transaction`, `promissory-note`).
          examples:
          - bank-transaction
        contact:
          anyOf:
          - $ref: '#/components/schemas/BaseContactSchema-Input'
          - type: 'null'
          description: Contact (client/supplier) the operation is due from or to.
        additionalInfo:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Additionalinfo
          description: Free-form key/value metadata to attach to the operation.
        invoiceGroupDocumentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoicegroupdocumentid
          description: Identifier of the invoice group this operation belongs to, if any.
        sync:
          type: boolean
          title: Sync
          description: Marks the operation as synchronized on your side.
          default: false
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: Identifier of the source document (e.g. invoice number).
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values to attach to the operation.
        externalReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalreference
          description: Free-form reference to this operation in an external system.
        customId:
          anyOf:
          - type: string
          - type: 'null'
          title: Customid
          description: Your own unique ID for the operation. If omitted, Embat auto-generates one.
          examples:
          - invoice-2024-001
        documentType:
          anyOf:
          - $ref: '#/components/schemas/OperationDocumentTypeEnum'
          - type: 'null'
          description: Type of the source document. Defaults to `invoice` when omitted.
          examples:
          - invoice
      type: object
      required:
      - issuanceDate
      - dueDate
      - concept
      - amount
      - currency
      title: PostOperationsRequestSchema
    ModifyOperationsResponseSchema:
      properties:
        id:
          type: string
          title: Id
          description: Embat resource ID
      type: object
      required:
      - id
      title: ModifyOperationsResponseSchema
