        chargeAccount:
          anyOf:
          - type: string
          - type: 'null'
          title: Chargeaccount
          description: IBAN of your own bank account the operation is charged to.
        contactAccount:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactaccount
