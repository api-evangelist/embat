          examples:
          - Acme Supplies
        legalName:
          anyOf:
          - type: string
          - type: 'null'
          title: Legalname
          description: Legal (registered) name of the contact.
          examples:
          - Acme Supplies S.L.
        taxId:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxid
