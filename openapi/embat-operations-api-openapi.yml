          anyOf:
          - type: string
          - type: 'null'
          title: Accountingcode
          description: Accounting account code the operation is posted to.
        accountingName:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountingname
          description: Accounting account name the operation is posted to.
        operationsCustomIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Operationscustomids
          description: 'Custom IDs of other operations grouped under this one, to represent an invoice group or remittance (typically combined with `documentType` set to `invoiceGroup`). Takes effect on `POST` (create or upsert): each referenced operation is marked `paid`, its `pendingAmount`/`pendingAccountingAmount` set to 0 and its payment date set to this operation''s `paymentDate`. Resending the remittance without some previously grouped operations releases them: they return to `pending` with their full pending amount. Sending this field on a `PATCH` update has no effect.'
        concept:
          anyOf:
          - type: string
          - type: 'null'
          title: Concept
          description: Free-text description of the operation.
          examples:
          - 'Invoice #2024-001'
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
          description: Total amount of the operation, in `currency`.
          examples:
          - 1250.5
        accountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Accountingamount
          description: Amount of the operation expressed in the company accounting currency.
          examples:
          - 1250.5
        pendingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Pendingamount
          description: Amount still pending settlement, in `currency`.
          examples:
          - 1250.5
        pendingAccountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Pendingaccountingamount
          description: Amount still pending settlement, expressed in the accounting currency.
          examples:
          - 1250.5
        currency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: ISO currency code of `amount`.
          examples:
          - EUR
        accountingCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: ISO currency code of `accountingAmount`.
          examples:
          - EUR
        exchangeRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Exchangerate
          description: Exchange rate applied between `currency` and `accountingCurrency`.
          examples:
          - 1.0
        paymentMethod:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentmethod
          description: Payment method associated with the operation (e.g. `bank-transaction`, `promissory-note`).
          examples:
          - bank-transaction
        contact:
          anyOf:
          - $ref: '#/components/schemas/BaseContactSchema-Input'
          - type: 'null'
          description: Contact (client/supplier) the operation is due from or to.
        additionalInfo:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Additionalinfo
          description: Free-form key/value metadata to attach to the operation.
        invoiceGroupDocumentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoicegroupdocumentid
          description: Identifier of the invoice group this operation belongs to, if any.
        sync:
          type: boolean
          title: Sync
          description: Marks the operation as synchronized on your side.
          default: false
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: Identifier of the source document (e.g. invoice number).
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values to attach to the operation.
        externalReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalreference
          description: Free-form reference to this operation in an external system.
        customId:
          type: string
          title: Customid
          description: Embat custom/auto-generated unique operation ID. You can use it as your own custom ERP operation ID.
      type: object
      required:
      - customId
      title: AuxBulkPatchOperationsRequestSchema
    ContactAddressSchema:
