      type: object
      required:
      - data
      title: BulkPostTransactionsRequestSchema
    TransactionCurrencyExchangeDataSchema:
      properties:
        originalAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Originalamount
          description: Transaction amount before currency conversion.
          examples:
          - 500.0
        originalCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: Currency of `originalAmount`, before conversion.
          examples:
          - USD
        grossAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Grossamount
          description: Transaction amount after currency conversion, before conversion fees.
          examples:
          - 460.25
        fees:
          anyOf:
          - type: number
          - type: 'null'
          title: Fees
          description: Fees applied during the currency conversion.
          examples:
          - 3.5
      type: object
      title: TransactionCurrencyExchangeDataSchema
    AuxBulkPatchTransactionsRequestSchema:
      properties:
        additionalInfo:
          additionalProperties: true
          type: object
          title: Additionalinfo
          description: Free-form key/value metadata to attach to the transaction.
          default: {}
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values to attach to the transaction.
        sync:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sync
          description: Marks the transaction as synchronized with your ERP.
        id:
          type: string
          title: Id
          description: Embat transaction ID
      type: object
      required:
      - id
      title: AuxBulkPatchTransactionsRequestSchema
    PostTransactionsRequestSchema:
      properties:
        operationDate:
          type: string
          format: date
          title: Operationdate
          description: Date the transaction was recorded (booked).
        valueDate:
          type: string
          format: date
          title: Valuedate
          description: Value date of the transaction, used for the product's balance.
        concept:
          type: string
          title: Concept
          description: Free-text description of the transaction.
          examples:
          - Office supplies
        amount:
          type: number
          title: Amount
          description: Amount of the transaction, in the product's currency.
          examples:
          - -350.0
      type: object
      required:
      - operationDate
      - valueDate
      - concept
      - amount
      title: PostTransactionsRequestSchema
      description: Transactions request data schema
    PatchTransactionsRequestSchema:
      properties:
        additionalInfo:
          additionalProperties: true
          type: object
          title: Additionalinfo
          description: Free-form key/value metadata to attach to the transaction.
          default: {}
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values to attach to the transaction.
        sync:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sync
          description: Marks the transaction as synchronized with your ERP.
      type: object
      title: PatchTransactionsRequestSchema
    AttributeValueRequestSchema:
      properties:
        customId:
          type: string
          title: Customid
          description: Custom ID of the attribute (see the Attributes endpoints) being set.
          examples:
          - cost-center
        value:
          type: string
          title: Value
          description: Display text of the value being set on this entity.
          examples:
          - Marketing
        valueCustomId:
          anyOf:
          - type: string
          - type: 'null'
          title: Valuecustomid
          description: Custom ID of one of the attribute's predefined `values`, when the attribute is of type `list`. Leave unset for free-form `string`/`number` attributes.
          examples:
          - marketing
        parentCustomId:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentcustomid
          description: Not used when attaching an attribute value to an entity.
      type: object
      required:
      - customId
      - value
      title: AttributeValueRequestSchema
      description: 'Attaches an attribute value to another entity (payment, contact, operation,

        transaction, accounting entry...).'
    ProductBaseSchema:
      properties:
        id:
          type: string
          title: Id
          description: Embat product ID.
          examples:
          - prod_8f3a1c
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code of the product.
          examples:
          - EUR
        product:
          type: string
          title: Product
          description: Product name as reported by the bank.
          examples:
          - Cuenta Corriente
        bankFullName:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankfullname
          description: Full legal name of the bank this product belongs to, if known.
          examples:
          - Banco Bilbao Vizcaya Argentaria
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
          description: Custom alias given to the product in Embat, if any.
          examples:
          - Main checking account
      type: object
      required:
      - id
      - currency
      - product
      title: ProductBaseSchema
    GetTransactionsResponseSchema:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Embat transaction ID.
        balance:
          anyOf:
          - type: number
          - type: 'null'
          title: Balance
          description: Balance of the product (bank account) immediately after this transaction.
          examples:
          - 15234.67
        operationDate:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Operationdate
          description: Date the transaction was recorded (booked) by the bank.
        valueDate:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valuedate
          description: Value date of the transaction, used for balance calculations.
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: Last time this transaction was updated in Embat.
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: Date this transaction was created in Embat.
        companyId:
          anyOf:
          - type: string
          - type: 'null'
          title: Companyid
          description: Embat company ID. You can get them from "companies" endpoints.
        additionalInfo:
          additionalProperties: true
          type: object
          title: Additionalinfo
          description: Free-form key/value metadata attached to the transaction. For some bank transactions, Embat automatically populates it with the bank-provided concept details (`ownConcept`, `commonConcept`), overriding any value previously set on this field.
          default: {}
        bank:
          anyOf:
          - type: string
          - type: 'null'
          title: Bank
          description: Name of the bank holding the product this transaction belongs to.
        concept:
          anyOf:
          - type: string
          - type: 'null'
          title: Concept
          description: Free-text description of the transaction, as reported by the bank. On `GET /transactions/{companyId}` (list), it is returned as an empty string when the value stored for the transaction is invalid.
          examples:
          - 'Invoice #2024-001 payment'
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
          description: Amount of the transaction, in the product's `currency`.
          examples:
          - 1250.5
        accountingAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Accountingamount
          description: Transaction amount expressed in the company accounting currency.
          examples:
          - 1250.5
        exchangeRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Exchangerate
          description: Exchange rate applied between the transaction currency and `accountingCurrency`.
          examples:
          - 1.0
        accountingCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: ISO currency code of `accountingAmount`.
          examples:
          - EUR
        reconciled:
          type: boolean
          title: Reconciled
          description: Whether the transaction has been fully reconciled against accounting entries.
          default: false
        status:
          anyOf:
          - $ref: '#/components/schemas/StatusEnum'
          - type: 'null'
          description: 'Booking status reported by the bank: `PENDING` while the transaction has not yet settled, `BOOKED` once confirmed. `null` when the bank reported no status or any other value.'
        product:
          anyOf:
          - $ref: '#/components/schemas/ProductBaseSchema'
          - type: 'null'
          description: Product (bank account) this transaction belongs to.
        sync:
          type: boolean
          title: Sync
          description: Whether the transaction has been synchronized with your ERP. Use the `sync` filter on `GET /transactions/{companyId}` to fetch transactions still pending synchronization, then confirm them back with `PATCH`.
          default: false
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeValueRequestSchema'
            type: array
          - type: 'null'
          title: Attributes
          description: Custom attribute values attached to the transaction.
        categories:
          anyOf:
          - items:
              $ref: '#/components/schemas/TransactionsAnalyticsSchema'
            type: array
          - type: 'null'
          title: Categories
          description: Breakdown of the transaction amount across categories, for reporting.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Free-form labels attached to the transaction. Omitted from the response when the stored value is not a list of labels.
        groupAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Groupamount
          description: Transaction amount converted to the company group's shared currency. Only calculated when the company belongs to a group with a shared currency configured, and an exchange rate is available for the transaction date.
          examples:
          - 1180.25
        groupExchangeRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Groupexchangerate
          description: Exchange rate applied to compute `groupAmount`.
          examples:
          - 1.06
        groupCurrency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - type: 'null'
          description: Company group's shared currency, when configured.
          examples:
          - EUR
        currencyExchangeData:
          anyOf:
          - $ref: '#/components/schemas/TransactionCurrencyExchangeDataSchema'
          - type: 'null'
          description: Currency conversion details, when the transaction involved one.
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          description: Free-text comment added to the transaction in Embat.
        reconciliationsIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Reconciliationsids
          description: Embat reconciliation IDs associated with this transaction, when reconciled.
        type:
          anyOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          - type: 'null'
          description: Embat's automatic classification of the transaction (e.g. `payment`, `fee`, `tax`, `collection`). `null` when the transaction could not be classified.
      type: object
      title: GetTransactionsResponseSchema
      description: Transactions response data schema
    ListTransactionsResponseSchema:
      properties:
        data:
          items:
            $ref: '#/components/schemas/GetTransactionsResponseSchema'
          type: array
          title: Data
          description: Transactions matching the query.
        nextPageToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextpagetoken
          description: Token to fetch the next page of results. `null` when there are no more pages.
      type: object
      required:
      - data
      title: ListTransactionsResponseSchema
    BulkPatchTransactionsRequestSchema:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AuxBulkPatchTransactionsRequestSchema'
          type: array
          title: Data
          description: Transactions to update, identified by `id`.
      type: object
      required:
      - data
      title: BulkPatchTransactionsRequestSchema
    BulkModifyTransactionsResponseSchema:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ModifyTransactionsResponseSchema'
          type: array
          title: Data
          description: Result of the bulk operation, one entry per transaction.
      type: object
      required:
      - data
      title: BulkModifyTransactionsResponseSchema
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable explanation of the error.
          examples:
          - user not authorized
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Error payload returned by the API (FastAPI `detail` convention).
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TransactionTypeEnum:
      type: string
      enum:
      - payment
      - debt_repayment
      - fee
      - tax
      - utility
      - social_security
      - bulk_payment
      - cash_withdrawal
      - pos_withdrawal
      - collection
      - pos_settlement
      - cash_settlement
      - collection_refund
      - bulk_collection
      title: TransactionTypeEnum
    StatusEnum:
      type: string
      enum:
      - PENDING
      - BOOKED
      title: StatusEnum
    TransactionsAnalyticsSchema:
      properties:
        categoryId:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoryid
          description: Embat ID of the category this portion of the amount is allocated to.
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Amount of the transaction allocated to this category.
          examples:
          - 150.0
      type: object
      title: TransactionsAnalyticsSchema
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
