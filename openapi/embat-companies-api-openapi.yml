        id:
          type: string
          title: Id
          description: Embat company ID. Use it as `companyId` in the rest of the API.
          examples:
          - company_5f2c1a
        legalName:
          type: string
          title: Legalname
          description: Company legal name.
          examples:
          - Acme Corporation S.L.
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: Last updated date of the entity in the database
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: Created date of the entity in the database
        contact:
