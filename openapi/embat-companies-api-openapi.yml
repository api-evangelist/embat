      type: object
      required:
      - data
      title: ListCompanyUsersResponseSchema
    CompanyConfigSchema:
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
          description: Company's accounting currency. Defaults to `EUR` when not configured.
          default: EUR
          examples:
          - EUR
      type: object
      title: CompanyConfigSchema
    TagsSchema:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Embat tag ID.
          examples:
          - tag_4d2f1a
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: Last updated date of the entity in the database
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: Created date of the entity in the database
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Tag name.
          examples:
          - VIP
      type: object
      required:
      - updatedAt
      - createdAt
      title: TagsSchema
    app__schemas__companies__ContactSchema:
      properties:
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Phone number of the company's administrative contact.
          examples:
          - '+34600123456'
        name:
