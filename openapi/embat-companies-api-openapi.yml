          - $ref: '#/components/schemas/app__schemas__companies__ContactSchema'
          - type: 'null'
          description: Company's administrative contact.
        tags:
          anyOf:
          - items:
              $ref: '#/components/schemas/TagsSchema'
            type: array
          - type: 'null'
          title: Tags
          description: Tags assigned to the company, used for classification in Embat.
        config:
          anyOf:
          - $ref: '#/components/schemas/CompanyConfigSchema'
          - type: 'null'
          description: Company-level configuration, such as the accounting currency.
      type: object
      required:
      - id
      - legalName
      title: CompanyResponseSchema
    CompanyUserSchema:
      properties:
        id:
          type: string
          title: Id
          description: Embat user ID.
          examples:
          - user_8f3a1c
        email:
          type: string
          title: Email
          description: User's email address.
          examples:
          - laura.fernandez@acme.com
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: Last updated date of the entity in the database
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: Created date of the entity in the database
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: User's first name.
          examples:
          - Laura
        surname:
          anyOf:
          - type: string
          - type: 'null'
          title: Surname
          description: User's last name.
          examples:
          - Fernández
      type: object
      required:
